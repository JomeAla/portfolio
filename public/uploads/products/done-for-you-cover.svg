<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="50%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f5f3ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="90" cy="120" r="100" fill="rgba(255,255,255,0.08)"/>
  <circle cx="720" cy="480" r="140" fill="rgba(255,255,255,0.06)"/>
  <circle cx="680" cy="100" r="60" fill="rgba(255,255,255,0.04)"/>
  
  <!-- DFDY Badge -->
  <rect x="50" y="50" width="180" height="40" rx="20" fill="rgba(255,255,255,0.2)"/>
  <text x="140" y="77" font-family="system-ui" font-size="14" font-weight="bold" fill="white" text-anchor="middle">★ DONE-FOR-YOU</text>
  
  <!-- Main Card -->
  <rect x="100" y="120" width="600" height="380" rx="24" fill="url(#card)"/>
  
  <!-- Gear Icon -->
  <g transform="translate(270, 170)" stroke="#4f46e5" stroke-width="8" fill="none">
    <circle cx="60" cy="60" r="50"/>
    <circle cx="60" cy="60" r="25"/>
    <line x1="60" y1="0" x2="60" y2="25"/>
    <line x1="60" y1="95" x2="60" y2="120"/>
    <line x1="0" y1="60" x2="25" y2="60"/>
    <line x1="95" y1="60" x2="120" y2="60"/>
    <line x1="18" y1="18" x2="38" y2="38"/>
    <line x1="82" y1="82" x2="102" y2="102"/>
    <line x1="18" y1="102" x2="38" y2="82"/>
    <line x1="82" y1="38" x2="102" y2="18"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="285" font-family="system-ui" font-size="30" font-weight="bold" fill="#1e40af" text-anchor="middle">Done-For-You Email</text>
  <text x="400" y="320" font-family="system-ui" font-size="30" font-weight="bold" fill="#1e40af" text-anchor="middle">Automation Service</text>
  
  <!-- Features -->
  <text x="400" y="365" font-family="system-ui" font-size="15" fill="#4b5563" text-anchor="middle">✓ 3 Custom Sequences Built</text>
  <text x="400" y="390" font-family="system-ui" font-size="15" fill="#4b5563" text-anchor="middle">✓ Full Implementation</text>
  <text x="400" y="415" font-family="system-ui" font-size="15" fill="#4b5563" text-anchor="middle">✓ 30 Days Support</text>
  
  <!-- Price -->
  <rect x="320" y="440" width="160" height="45" rx="22" fill="#4338ca"/>
  <text x="400" y="470" font-family="system-ui" font-size="22" font-weight="bold" fill="white" text-anchor="middle">₦150,000</text>
  
  <!-- Footer Note -->
  <text x="400" y="560" font-family="system-ui" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">JoAla Ventures • Results Guaranteed</text>
</svg>