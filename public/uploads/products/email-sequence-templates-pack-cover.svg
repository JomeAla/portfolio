<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5d52"/>
      <stop offset="100%" style="stop-color:#3d4f45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g fill="#fff">
    <!-- Envelope icon -->
    <rect x="280" y="240" width="240" height="180" rx="16" stroke="#fff" stroke-width="4" fill="none"/>
    <polyline points="280,260 400,360 520,260" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <!-- Multiple email icons -->
    <rect x="340" y="420" width="120" height="24" rx="4" fill="#fff" opacity="0.3"/>
    <rect x="340" y="452" width="120" height="24" rx="4" fill="#fff" opacity="0.2"/>
    <rect x="340" y="484" width="120" height="24" rx="4" fill="#fff" opacity="0.1"/>
  </g>
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">Email Sequence</text>
  <text x="400" y="630" font-family="Arial, sans-serif" font-size="36" fill="#e8e4df" text-anchor="middle">Templates Pack</text>
  <text x="400" y="680" font-family="Arial, sans-serif" font-size="24" fill="#e8e4df" text-anchor="middle">24 Professional Templates</text>
  <circle cx="620" cy="180" r="80" fill="#fff" opacity="0.2"/>
  <text x="620" y="195" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">₦15K</text>
</svg>
